[package]
name = "tule-desktop"
version.workspace = true
description = "TULE desktop host"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tule_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = { version = "0.23", default-features = false, features = ["std"] }
eventsource-stream = "0.2"
futures-util = "0.3"
keyring-core = "1"
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls", "timing-resistant-secret-traits"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "blocking"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "extra_check"] }
rusqlite_migration = { version = "2.6", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
tule-core = { path = "../../../crates/tule-core" }
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1", default-features = false }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "test-util"] }
